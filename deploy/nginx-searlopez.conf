# Alternative to Caddy: serve searlopez.com from the nginx that already owns
# ports 80 and 443 on this host.
#
#   sudo cp deploy/nginx-searlopez.conf /etc/nginx/sites-available/searlopez
#   sudo ln -s /etc/nginx/sites-available/searlopez /etc/nginx/sites-enabled/searlopez
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d searlopez.com -d www.searlopez.com --redirect
#
# Certbot rewrites this file to add the ssl_certificate lines and the
# HTTP to HTTPS redirect. Then change scripts/deploy.sh to reload nginx.

server {
    server_name searlopez.com www.searlopez.com;

    root /opt/projects/searlopez/dist;
    index index.html;

    # www to apex
    if ($host = www.searlopez.com) {
        return 301 $scheme://searlopez.com$request_uri;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/pdf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/searlopez.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/searlopez.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}


server {
    if ($host = www.searlopez.com) {
        return 301 https://searlopez.com$request_uri;
    }
    if ($host = searlopez.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name searlopez.com www.searlopez.com;
    return 404; # managed by Certbot


}